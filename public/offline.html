<!doctype html>
<!-- 오프라인 안내 화면(#8). 인터넷이 끊긴 채 페이지를 열면 서비스 워커(sw.js)가 이 화면을 보여 준다.
     네트워크 없이 떠야 하므로 글꼴·스타일을 모두 안에 둔다. 색은 tokens.css 값과 같다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>연결이 안 돼요 · 프로듀스 댕냥</title>
<style>
  :root { --paper: #FFFFFF; --ink: #141414; --ink-2: #5F5F5F; --pink: #D62A66; --pink-text: #C2255F; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper: #000000; --ink: #FFFFFF; --ink-2: #B4B4B4; --pink: #FF6FA0; --pink-text: #FF6FA0; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
         padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  .logo { color: var(--ink); font-weight: 900; font-size: 20px; letter-spacing: -.03em; margin: 0 0 28px; }
  .logo em { font-style: normal; color: var(--pink-text); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin: 0 0 24px; }
  button { font: inherit; font-size: 14px; min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="logo">프로듀스 <em>댕냥</em></p>
  <h1 id="t">인터넷이 끊겼어요</h1>
  <p id="d">연결되면 다시 시도해 주세요. 오늘 준 픽은 그대로 남아 있어요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
<script>
  // 인터넷은 되는데 서버가 답하지 않은 경우(#8 리뷰): 와이파이를 만지지 않게 문구를 바꾼다
  if (navigator.onLine) {
    document.getElementById("t").textContent = "잠시 연결이 불안정해요";
    document.getElementById("d").textContent = "조금 뒤 다시 시도해 주세요. 오늘 준 픽은 그대로 남아 있어요.";
  }
</script>
</body>
</html>
