# 푸시·PR 마다 린트, 타입 검사, 단위 시험, Cloudflare 용 빌드, DB 규칙 시험(pgTAP)을 돌린다.
# 배포는 여기서 하지 않는다(로컬에서 npm run deploy). 비밀값이 필요 없게 유지한다.
name: CI
on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
permissions:
  contents: read
# 같은 브랜치에 새로 올리면 앞 실행은 멈춘다. PR 과 브랜치 push 가 같은 커밋을 두 번 돌리는 것도 하나로 줄인다.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen   # 워커 바인딩 타입(cloudflare-env.d.ts, 커밋하지 않음)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx opennextjs-cloudflare build

  db:
    # 마이그레이션을 빈 로컬 Supabase 에 처음부터 적용하고 supabase/tests 의 pgTAP 시험을 돌린다.
    # 시험에 필요 없는 서비스는 띄우지 않는다(auth·storage 스키마는 gotrue·storage-api 가 만든다).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - run: supabase test db

  e2e:
    # 주요 흐름 E2E(#9): 빈 로컬 Supabase(마이그레이션 + seed.sql + 시드 사진)에 빌드한 Next 서버를 붙여 Playwright 로 돈다.
    # 봇 확인은 Cloudflare 공개 시험 키(항상 통과)라 비밀값이 필요 없다. 결선 주간에는 시험이 스스로 건너뛴다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_BIN: supabase
      E2E_PORT: "3104"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - run: npm ci
      - name: 로컬 Supabase 띄우기
        run: |
          echo "SUPABASE_AUTH_CAPTCHA_SECRET=1x0000000000000000000000000000000AA" > supabase/.env
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
          bash supabase/seed-photos.sh
      - name: 앱 환경 변수(로컬 Supabase 주소·공개 키)
        run: |
          status="$(supabase status -o env)"
          get() { printf '%s\n' "$status" | sed -n "s/^$1=\"\(.*\)\"$/\1/p"; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3104"
          } >> "$GITHUB_ENV"
      - run: npm run cf-typegen   # 빌드 중 타입 검사가 워커 바인딩 타입을 찾는다
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_START: npx next start -p 3104
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
